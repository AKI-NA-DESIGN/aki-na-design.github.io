<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AKI-NA DESIGN</title>
  <!-- Google Search Console 所有確認用（削除しないこと） -->
  <meta name="google-site-verification" content="L21VeROpv5ije5Vus5yydLY-NKFQ2TJqP_AAiEwtVrE" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: #3a3a3c; background: #fff; line-height: 1.9;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .wrap { max-width: 560px; text-align: center; }
    h1 { font-size: 22px; color: #2AB5C9; margin-bottom: 8px; }
    p { font-size: 15px; color: #555; margin-bottom: 28px; }
    .apps { display: flex; flex-direction: column; gap: 12px; }
    a.app {
      display: block; text-decoration: none; color: #3a3a3c;
      border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px 20px;
      transition: border-color .2s;
    }
    a.app:hover { border-color: #2AB5C9; }
    a.app strong { display: block; font-size: 16px; color: #2AB5C9; margin-bottom: 2px; }
    a.app span { font-size: 13px; color: #777; }
    footer { margin-top: 32px; font-size: 12px; color: #9a9a9e; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AKI-NA DESIGN</h1>
    <p>アプリを制作しています。</p>
    <div class="apps">
      <a class="app" href="./alarm-calendar-site/">
        <strong>アラームカレンダー</strong>
        <span>予定の時間に何度も鳴って知らせる、家族で使えるカレンダー</span>
      </a>
    </div>
    <footer>© 2026 AKI-NA DESIGN</footer>
  </div>
</body>
</html>
